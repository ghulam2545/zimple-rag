services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_db
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: backend_password
    ports:
      - "5400:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: